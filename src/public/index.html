<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Registry Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .service-card {
            transition: all 0.3s ease;
        }
        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .status-badge {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .status-up {
            background-color: #10B981;
        }
        .status-down {
            background-color: #EF4444;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-white shadow-lg">
            <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center">
                    <h1 class="text-3xl font-bold text-gray-900">
                        <i class="fas fa-server mr-2"></i>
                        Service Registry Dashboard
                    </h1>
                    <div class="text-sm text-gray-500">
                        Dernière mise à jour: <span id="lastUpdate">-</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
            <!-- Stats -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="p-3 rounded-full bg-blue-100 text-blue-500">
                            <i class="fas fa-server text-2xl"></i>
                        </div>
                        <div class="ml-4">
                            <h2 class="text-gray-600 text-sm">Services Totaux</h2>
                            <p class="text-2xl font-semibold text-gray-800" id="totalServices">0</p>
                        </div>
                    </div>
                </div>
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="p-3 rounded-full bg-green-100 text-green-500">
                            <i class="fas fa-check-circle text-2xl"></i>
                        </div>
                        <div class="ml-4">
                            <h2 class="text-gray-600 text-sm">Services Actifs</h2>
                            <p class="text-2xl font-semibold text-gray-800" id="activeServices">0</p>
                        </div>
                    </div>
                </div>
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="p-3 rounded-full bg-red-100 text-red-500">
                            <i class="fas fa-exclamation-circle text-2xl"></i>
                        </div>
                        <div class="ml-4">
                            <h2 class="text-gray-600 text-sm">Services Inactifs</h2>
                            <p class="text-2xl font-semibold text-gray-800" id="inactiveServices">0</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Services Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="servicesGrid">
                <!-- Les cartes de services seront ajoutées ici dynamiquement -->
            </div>
        </main>
    </div>

    <script>
        // Fonction pour formater la date
        function formatDate(date) {
            return new Date(date).toLocaleString('fr-FR', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        // Fonction pour mettre à jour les statistiques
        function updateStats(services) {
            const total = services.length;
            const active = services.filter(s => s.status === 'UP').length;
            const inactive = total - active;

            document.getElementById('totalServices').textContent = total;
            document.getElementById('activeServices').textContent = active;
            document.getElementById('inactiveServices').textContent = inactive;
        }

        // Fonction pour créer une carte de service
        function createServiceCard(service) {
            return `
                <div class="service-card bg-white rounded-lg shadow p-6">
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center">
                            <span class="status-badge ${service.status === 'UP' ? 'status-up' : 'status-down'}"></span>
                            <h3 class="text-lg font-semibold text-gray-800">${service.name}</h3>
                        </div>
                        <span class="px-2 py-1 text-xs rounded-full ${service.status === 'UP' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                            ${service.status}
                        </span>
                    </div>
                    <div class="space-y-2">
                        <p class="text-sm text-gray-600">
                            <i class="fas fa-link mr-2"></i>
                            ${service.host}:${service.port}
                        </p>
                        <p class="text-sm text-gray-600">
                            <i class="fas fa-heartbeat mr-2"></i>
                            Health: ${service.healthUrl}
                        </p>
                        <p class="text-sm text-gray-600">
                            <i class="fas fa-clock mr-2"></i>
                            Dernier heartbeat: ${formatDate(service.lastHeartbeat || new Date())}
                        </p>
                    </div>
                </div>
            `;
        }

        // Fonction pour rafraîchir les données
        async function refreshData() {
            try {
                const response = await fetch('/api/registry/instances');
                const data = await response.json();
                
                const servicesGrid = document.getElementById('servicesGrid');
                servicesGrid.innerHTML = '';
                
                data.instances.forEach(service => {
                    servicesGrid.innerHTML += createServiceCard(service);
                });
                
                updateStats(data.instances);
                document.getElementById('lastUpdate').textContent = formatDate(new Date());
            } catch (error) {
                console.error('Erreur lors de la récupération des services:', error);
            }
        }

        // Rafraîchir les données toutes les 5 secondes
        refreshData();
        setInterval(refreshData, 5000);
    </script>
</body>
</html>
